<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TipS!!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7f9fb;
      color: #333;
      padding: 12px;
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 680px;
      background: #ffffff;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    
    /* 상단 헤더 & 검색창 */
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .logo {
      font-size: 26px;
      font-weight: 900;
      color: #1a73e8;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }
    .search-input {
      flex: 1;
      padding: 9px 12px;
      font-size: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: #1a73e8;
    }

    /* 입력 폼 박스 */
    .form-box {
      background: #fbfcfe;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #666;
      margin-bottom: 4px;
    }
    .form-control {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .form-control:focus {
      border-color: #1a73e8;
    }
    textarea.form-control {
      resize: vertical;
      min-height: 90px;
      font-family: inherit;
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #1a73e8;
      color: white;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .submit-btn:disabled {
      background-color: #94a3b8;
    }

    /* 카테고리 필터 바 (시트에 보관하기 밑으로 이동) */
    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 0 12px 0;
      margin-bottom: 10px;
    }
    .cat-btn {
      padding: 6px 14px;
      border: 1px solid #dcdcdc;
      border-radius: 20px;
      background-color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      color: #555;
    }
    .cat-btn.active {
      background-color: #1a73e8;
      color: #fff;
      border-color: #1a73e8;
    }

    /* 목록 영역 상단 */
    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #475569;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 1. 카테고리 폴더 뷰 (기본 화면) */
    .folder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    .folder-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .folder-card:active {
      background: #e8f0fe;
      transform: scale(0.98);
    }
    .folder-name {
      font-size: 14px;
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 4px;
    }
    .folder-count {
      font-size: 12px;
      color: #64748b;
    }

    /* 2. 항목 리스트 뷰 */
    .simple-list {
      list-style: none;
    }
    .simple-item {
      padding: 12px 6px;
      border-bottom: 1px solid #edf2f7;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: baseline;
    }
    .simple-item:active {
      background-color: #f1f5f9;
    }
    .simple-tag {
      font-weight: bold;
      color: #1a73e8;
      margin-right: 8px;
      white-space: nowrap;
    }
    .simple-title {
      color: #334155;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 상세 모달 팝업 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 520px;
      border-radius: 12px;
      padding: 20px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-tag {
      font-size: 12px;
      font-weight: bold;
      color: #1a73e8;
      background: #e8f0fe;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
      margin-bottom: 8px;
    }
    .modal-title {
      font-size: 17px;
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 8px;
    }
    .modal-link {
      font-size: 13px;
      color: #0284c7;
      word-break: break-all;
      margin-bottom: 12px;
      text-decoration: underline;
      display: inline-block;
    }
    .modal-content {
      font-size: 14px;
      color: #475569;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-y: auto;
      flex: 1;
      padding: 10px 0;
      border-top: 1px solid #f1f5f9;
      border-bottom: 1px solid #f1f5f9;
      margin-bottom: 14px;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .btn-action {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    .btn-edit { background: #f1f5f9; color: #334155; }
    .btn-delete { background: #fee2e2; color: #dc2626; }
    .btn-close { background: #1a73e8; color: #fff; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 상단 헤더: placeholder 제거 -->
  <div class="header-row">
    <div class="logo">TipS!!</div>
    <input type="text" id="searchInput" class="search-input">
  </div>

  <!-- 입력 폼 -->
  <div class="form-box" id="inputFormBox">
    <div class="form-group">
      <label>카테고리 (선택 또는 직접입력)</label>
      <input type="text" id="inputCategory" list="categoryDatalist" class="form-control" placeholder="예: A.I., 포토, 영상 등">
      <datalist id="categoryDatalist">
        <option value="A.I.">
        <option value="포토">
        <option value="영상">
        <option value="오디오">
        <option value="유튜브">
        <option value="기타">
      </datalist>
    </div>
    <div class="form-group">
      <label>내용 제목</label>
      <input type="text" id="inputTitle" class="form-control">
    </div>
    <div class="form-group">
      <label>URL</label>
      <input type="url" id="inputUrl" class="form-control">
    </div>
    <div class="form-group">
      <label>내용</label>
      <textarea id="inputContent" class="form-control"></textarea>
    </div>
    <button type="button" class="submit-btn" id="saveBtn" onclick="saveTip()">시트에 보관하기</button>
  </div>

  <!-- 카테고리 태그 바 (위치 이동) -->
  <div class="category-scroll" id="categoryFilter">
    <button class="cat-btn active" onclick="setCategory('ALL')">전체</button>
  </div>

  <div class="section-title">
    <span id="viewTitle">카테고리 모아보기</span>
    <span id="countText" style="font-size:12px; color:#888;"></span>
  </div>

  <!-- 목록 노출 영역 -->
  <div id="displayArea"></div>
</div>

<!-- 상세 모달창 -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <span class="modal-tag" id="modalCategory"></span>
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalUrlWrapper"></div>
    <div class="modal-content" id="modalContent"></div>
    <div class="modal-actions">
      <button class="btn-action btn-edit" onclick="editCurrentTip()">수정</button>
      <button class="btn-action btn-delete" onclick="deleteCurrentTip()">삭제</button>
      <button class="btn-action btn-close" onclick="closeModal()">확인</button>
    </div>
  </div>
</div>

<script>
  const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJlo_X5N-vui1jrGeAD_6Z9oy6jS04c86k2exV7ivSvt8cCEph6h_wlwscsPRIho5t/exec";

  let tipsData = [];
  let currentCategory = "ALL";
  let searchQuery = "";
  let selectedTipIndex = null;

  function loadData() {
    const displayArea = document.getElementById("displayArea");
    displayArea.innerHTML = "<p style='color:#888; text-align:center; padding:20px;'>데이터 불러오는 중...</p>";

    const oldScript = document.getElementById("jsonp_loader");
    if (oldScript) oldScript.remove();

    window.handleData = function(data) {
      tipsData = data;
      buildCategoryList();
      render();
    };

    const script = document.createElement("script");
    script.id = "jsonp_loader";
    script.src = `${GOOGLE_APPS_SCRIPT_URL}?action=read&callback=handleData&t=${new Date().getTime()}`;
    document.body.appendChild(script);
  }

  // 데이터 기반 동적 카테고리 생성 (필터 버튼 & datalist)
  function buildCategoryList() {
    const rawCategories = tipsData.map(item => item.category ? item.category.trim() : "").filter(Boolean);
    const uniqueCategories = Array.from(new Set(rawCategories));

    // 필터 버튼 생성
    const catContainer = document.getElementById("categoryFilter");
    catContainer.innerHTML = `<button class="cat-btn ${currentCategory === 'ALL' ? 'active' : ''}" onclick="setCategory('ALL')">전체</button>`;
    
    // datalist 초기화
    const dataList = document.getElementById("categoryDatalist");
    dataList.innerHTML = "";

    uniqueCategories.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = `cat-btn ${currentCategory === cat ? 'active' : ''}`;
      btn.innerText = cat;
      btn.onclick = () => setCategory(cat);
      catContainer.appendChild(btn);

      const opt = document.createElement("option");
      opt.value = cat;
      dataList.appendChild(opt);
    });
  }

  function setCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll(".cat-btn").forEach(btn => {
      btn.classList.toggle("active", btn.innerText === (cat === 'ALL' ? '전체' : cat));
    });
    render();
  }

  async function saveTip() {
    const category = document.getElementById("inputCategory").value.trim() || "기타";
    const title = document.getElementById("inputTitle").value.trim();
    const url = document.getElementById("inputUrl").value.trim();
    const content = document.getElementById("inputContent").value.trim();

    if (!title || !content) {
      alert("제목과 내용을 입력해 주세요.");
      return;
    }

    const saveBtn = document.getElementById("saveBtn");
    saveBtn.disabled = true;
    saveBtn.innerText = "저장 중...";

    try {
      await fetch(GOOGLE_APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ category, title, url, content })
      });

      alert("성공적으로 보관되었습니다!");
      document.getElementById("inputCategory").value = "";
      document.getElementById("inputTitle").value = "";
      document.getElementById("inputUrl").value = "";
      document.getElementById("inputContent").value = "";
      loadData();
    } catch (e) {
      alert("저장 실패: " + e.message);
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerText = "시트에 보관하기";
    }
  }

  function render() {
    const displayArea = document.getElementById("displayArea");
    const viewTitle = document.getElementById("viewTitle");
    const countText = document.getElementById("countText");

    const q = searchQuery.toLowerCase().trim();
    const isSearching = q.length > 0;
    const isCategorySelected = currentCategory !== "ALL";

    // 1. 전체 상태이고 검색어가 없을 때 -> '카테고리 폴더 카드'만 표시
    if (!isSearching && !isCategorySelected) {
      viewTitle.innerText = "카테고리별 모아보기";
      countText.innerText = `총 ${tipsData.length}건`;

      if (tipsData.length === 0) {
        displayArea.innerHTML = "<p style='color:#999; text-align:center; padding:20px;'>저장된 팁이 없습니다.</p>";
        return;
      }

      // 카테고리별 건수 계산
      const counts = {};
      tipsData.forEach(item => {
        const cat = item.category ? item.category.trim() : "기타";
        counts[cat] = (counts[cat] || 0) + 1;
      });

      let html = `<div class="folder-grid">`;
      for (const [catName, count] of Object.entries(counts)) {
        html += `
          <div class="folder-card" onclick="setCategory('${escapeHtml(catName)}')">
            <div class="folder-name">${escapeHtml(catName)}</div>
            <div class="folder-count">${count}개 항목</div>
          </div>
        `;
      }
      html += `</div>`;
      displayArea.innerHTML = html;
      return;
    }

    // 2. 카테고리를 눌렀거나 검색어를 입력했을 때 -> 해당 항목 리스트 표시
    let filtered = tipsData.filter(item => {
      const matchCat = (currentCategory === "ALL" || item.category === currentCategory);
      const matchSearch = (!q || 
        (item.title && item.title.toLowerCase().includes(q)) || 
        (item.content && item.content.toLowerCase().includes(q)) ||
        (item.category && item.category.toLowerCase().includes(q))
      );
      return matchCat && matchSearch;
    });

    viewTitle.innerText = isSearching ? "검색 결과" : `[${currentCategory}] 목록`;
    countText.innerText = `${filtered.length}건`;

    if (filtered.length === 0) {
      displayArea.innerHTML = "<p style='color:#999; text-align:center; padding:20px;'>검색 결과가 없습니다.</p>";
      return;
    }

    let html = `<ul class="simple-list">`;
    filtered.forEach(item => {
      const originalIndex = tipsData.indexOf(item);
      html += `
        <li class="simple-item" onclick="openDetail(${originalIndex})">
          <span class="simple-tag">[${escapeHtml(item.category)}]</span>
          <span class="simple-title">${escapeHtml(item.title)}</span>
        </li>
      `;
    });
    html += `</ul>`;
    displayArea.innerHTML = html;
  }

  // 상세 모달 열기
  function openDetail(index) {
    selectedTipIndex = index;
    const item = tipsData[index];

    document.getElementById("modalCategory").innerText = item.category || "기타";
    document.getElementById("modalTitle").innerText = item.title;
    
    // URL 바로가기 링크 활성화
    const urlContainer = document.getElementById("modalUrlWrapper");
    if (item.url && item.url.trim()) {
      let href = item.url.trim();
      if (!href.startsWith("http://") && !href.startsWith("https://")) {
        href = "https://" + href;
      }
      urlContainer.innerHTML = `<a href="${href}" target="_blank" rel="noopener noreferrer" class="modal-link">🔗 ${escapeHtml(item.url)}</a>`;
    } else {
      urlContainer.innerHTML = "";
    }

    document.getElementById("modalContent").innerText = item.content;
    document.getElementById("detailModal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("detailModal").style.display = "none";
    selectedTipIndex = null;
  }

  // 수정: 기존 내용을 상단 입력 폼으로 불러옴
  function editCurrentTip() {
    if (selectedTipIndex === null) return;
    const item = tipsData[selectedTipIndex];

    document.getElementById("inputCategory").value = item.category || "";
    document.getElementById("inputTitle").value = item.title || "";
    document.getElementById("inputUrl").value = item.url || "";
    document.getElementById("inputContent").value = item.content || "";

    closeModal();
    window.scrollTo({ top: 0, behavior: "smooth" });
    document.getElementById("inputTitle").focus();
  }

  // 삭제 알림 및 처리 안내
  function deleteCurrentTip() {
    if (selectedTipIndex === null) return;
    const item = tipsData[selectedTipIndex];

    if (confirm(`'${item.title}' 항목을 삭제하시겠습니까?\n\n(참고: 현재 웹 앱 권한 설정상 안전을 위해 구글 시트에서 직접 행을 삭제하셔도 새로고침 시 바로 반영됩니다.)`)) {
      tipsData.splice(selectedTipIndex, 1);
      closeModal();
      buildCategoryList();
      render();
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
  }

  document.getElementById("searchInput").addEventListener("input", (e) => {
    searchQuery = e.target.value;
    render();
  });

  window.onload = () => {
    if (GOOGLE_APPS_SCRIPT_URL) loadData();
  };
</script>

</body>
</html>
